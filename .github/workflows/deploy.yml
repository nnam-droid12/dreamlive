name: Deploy to GitHub Pages

# Deploys on every push to main (and on demand).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # (A dev tool's dependency, onnxruntime-node, tries to download optional CUDA binaries that 404: skip them.)
      - run: npm ci
        env:
          npm_config_onnxruntime_node_install_cuda: skip
      - run: npm run typecheck
      - run: npm run build
        env:
          NODE_ENV: production
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
